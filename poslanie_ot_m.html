<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Послание от М. 💜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Comfortaa:wght@400;500;600&display=swap');
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    align-items: center; overflow: hidden;
    background:
      radial-gradient(ellipse at 15% 20%, #c6b4e9 0%, transparent 42%),
      radial-gradient(ellipse at 85% 15%, #a9c9e8 0%, transparent 40%),
      radial-gradient(ellipse at 80% 85%, #c7b9e9 0%, transparent 45%),
      radial-gradient(ellipse at 15% 85%, #b9d3ed 0%, transparent 45%),
      #eeeafa;
    font-family: 'Comfortaa', cursive; color: #514675;
}
body::before {
    content: ""; position: fixed; inset: 0;
    background-image: radial-gradient(circle, #ffffff55 1px, transparent 2px);
    background-size: 35px 35px; pointer-events: none;
}
.blob {
    position: absolute; border-radius: 50%; filter: blur(45px);
    opacity: .5; animation: float 9s ease-in-out infinite alternate;
    pointer-events: none;
}
.blob.one { width: 250px; height: 250px; background: #9e8ad4; top: -70px; left: -60px; }
.blob.two { width: 300px; height: 300px; background: #91bce2; bottom: -100px; right: -80px; animation-delay: -4s; }
.blob.three { width: 170px; height: 170px; background: #d5b4e9; top: 55%; left: 5%; animation-delay: -2s; }
@keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,-25px) scale(1.15); } }
.container {
    position: relative; z-index: 2; width: min(90%, 560px); padding: 55px 30px;
    text-align: center; border: 1px solid #ffffffa0; border-radius: 35px;
    background: #ffffff42; backdrop-filter: blur(12px);
    box-shadow: 0 15px 60px #76669a22;
}
.small { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: #8a7bb3; margin-bottom: 18px; }
h1 {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(40px, 9vw, 60px);
    line-height: 1; font-weight: 600; margin: 0 0 15px; color: #63528e;
}
.subtitle { font-size: 13px; line-height: 1.8; color: #8276a5; margin-bottom: 35px; }
button {
    border: none; cursor: pointer; padding: 19px 35px; border-radius: 50px;
    font-family: 'Comfortaa', cursive; font-size: 14px; color: white;
    background: linear-gradient(120deg, #9885c9, #819fcf);
    box-shadow: 0 8px 25px #8374b44a; transition: .3s;
}
button:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 12px 30px #8374b477; }
button:active { transform: scale(.97); }
.message {
    min-height: 115px; display: flex; justify-content: center; align-items: center;
    margin-top: 30px; padding: 20px; font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 5vw, 32px); line-height: 1.35; color: #66558e;
    opacity: 0; transform: translateY(10px); transition: .5s;
}
.message.show { opacity: 1; transform: translateY(0); }
.heart { position: absolute; font-size: 22px; opacity: .6; animation: heartbeat 3s infinite ease-in-out; }
.heart.a { top: 15%; left: 12%; }
.heart.b { bottom: 15%; right: 12%; animation-delay: 1s; }
.heart.c { top: 20%; right: 15%; animation-delay: 2s; }
@keyframes heartbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.footer { margin-top: 20px; font-size: 11px; letter-spacing: 2px; color: #a094bc; }
@media (max-width: 480px) {
    .container { padding: 42px 20px; }
    .heart.a { left: 5%; } .heart.b { right: 5%; }
}
</style>
</head>
<body>
<div class="blob one"></div><div class="blob two"></div><div class="blob three"></div>
<div class="heart a">♡</div><div class="heart b">♡</div><div class="heart c">✧</div>
<main class="container">
    <div class="small">a little something for you</div>
    <h1>Для Даши</h1>
    <div class="subtitle">Здесь спрятано кое-что особенное.<br>И каждое послание — от одного человека.</div>
    <button onclick="newMessage()">✧ Послание от М. ✧</button>
    <div class="message" id="message">Нажми на кнопку, и я кое-что тебе скажу...</div>
    <div class="footer">С ТЕПЛОМ, ОТ М. ♡</div>
</main>
<script>
const beginnings = [
"невероятно красивая","самое нежное чудо","умопомрачительно прекрасная","особенная",
"удивительная","светишься изнутри","настоящая драгоценность","прекраснее любого заката",
"очаровательная","вдохновляющая","неповторимая","лучшее, что может случиться с человеком",
"обладательница самой красивой улыбки","маленькое чудо в огромном мире","волшебная",
"заслуживаешь целую вселенную","самая уютная мысль","прекрасна даже в мелочах",
"моя любимая случайность","невероятно милая","как произведение искусства","редкая жемчужина",
"сияешь ярче звёзд","просто космос","удивительно талантливая","нежность в человеческом обличье",
"причина улыбаться","достойна всего самого прекрасного","сказочная","самая чудесная"
];
const endings = [
"и я надеюсь, что ты никогда этого не забудешь.","и мир становится лучше просто от того, что ты в нём есть.",
"и тебе даже не нужно стараться, чтобы быть особенной.","и никакие слова не смогут описать, насколько сильно.",
"и я бы хотел, чтобы ты увидела себя моими глазами.","и даже звёзды немного завидуют твоему сиянию.",
"и рядом с тобой обычные моменты становятся волшебными.","и ты заслуживаешь напоминаний об этом каждый день.",
"и это одна из самых прекрасных вещей на свете.","и я искренне восхищаюсь тобой.",
"и никакая фотография не передаст всей твоей красоты.","и у тебя есть удивительный талант делать мир теплее.",
"и ты гораздо прекраснее, чем сама думаешь.","и мне хочется, чтобы ты чаще улыбалась.",
"и это не комплимент, а чистая правда.","и я никогда не устану это повторять.",
"и в тебе есть что-то совершенно неповторимое.","и даже луна бледнеет рядом с тобой.",
"и ты достойна самой красивой истории любви.","и я надеюсь, что сегодня ты будешь счастлива."
];
const extra = [
"Твоя улыбка могла бы стать отдельным видом искусства.",
"Если бы красоту можно было измерить, ты бы сломала все приборы.",
"У тебя душа, которую хочется беречь.",
"Ты словно любимая песня, которую никогда не надоедает слушать.",
"В тебе удивительно сочетаются нежность и сила.",
"Твой смех — одна из моих любимых мелодий.",
"Ты делаешь даже пасмурные дни немного солнечнее.",
"У тебя невероятная способность оставаться в мыслях.",
"Ты — доказательство того, что чудеса существуют.",
"Даже тысяча комплиментов не расскажет всего о тебе."
];
const compliments = new Set();
while (compliments.size < 1000) {
    const first = beginnings[Math.floor(Math.random() * beginnings.length)];
    const last = endings[Math.floor(Math.random() * endings.length)];
    let phrase = `Даша, ты ${first}, ${last}`;
    if (Math.random() < 0.2) phrase = `Даша, ты ${first}. ${extra[Math.floor(Math.random() * extra.length)]}`;
    compliments.add(phrase);
}
const allMessages = Array.from(compliments);
let previous = -1;
function newMessage() {
    let index;
    do { index = Math.floor(Math.random() * allMessages.length); } while (index === previous);
    previous = index;
    const box = document.getElementById('message');
    box.classList.remove('show');
    setTimeout(() => {
        box.textContent = allMessages[index];
        box.classList.add('show');
    }, 250);
}
</script>
</body>
</html>
